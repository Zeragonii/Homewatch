name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r server/requirements.txt httpx pytest
      - name: Test API flows
        run: PYTHONPATH=. pytest -q tests
      - name: Validate frontend script
        run: node --check server/app/static/app.js

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '0.6.5'
          }
          "HOMEWATCH_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building HomeWatch Agent $version"

      - name: Validate bundled Defender PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/Manage-DefenderExclusions.ps1').Path,
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            throw "Bundled Defender script has syntax errors: $($parseErrors -join '; ')"
          }

      - name: Sanity-check generated C# source
        shell: pwsh
        run: |
          $source = Get-Content agent/HomeWatchAgent/Program.cs -Raw
          if ($source -match '\\n\s*\{') {
            throw 'Program.cs contains a literal \n escape before an opening brace; generated C# is malformed.'
          }

      - name: Check service source for invalid standalone null-coalescing throw
        shell: pwsh
        run: |
          $service = Get-Content agent/HomeWatchService/Program.cs -Raw
          if ($service -match '(?s)Process\.Start\s*\(.*?\)\s*\?\?\s*throw') {
            throw 'Service contains a standalone Process.Start(...) ?? throw expression; use an explicit null check.'
          }

      - name: Publish agent and updater
        shell: pwsh
        run: |
          dotnet publish agent/HomeWatchAgent/HomeWatchAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:HOMEWATCH_VERSION -o out/agent
          if ($LASTEXITCODE -ne 0) { throw "HomeWatchAgent publish failed ($LASTEXITCODE)" }
          dotnet publish agent/HomeWatchService/HomeWatchService.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:HOMEWATCH_VERSION -o out/service
          if ($LASTEXITCODE -ne 0) { throw "HomeWatchService publish failed ($LASTEXITCODE)" }
          Copy-Item out/service/HomeWatchService.exe out/agent/HomeWatchService.exe -Force
          dotnet publish agent/HomeWatchUpdater/HomeWatchUpdater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:HOMEWATCH_VERSION -o out/updater
          if ($LASTEXITCODE -ne 0) { throw "HomeWatchUpdater publish failed ($LASTEXITCODE)" }
          Copy-Item out/updater/HomeWatchUpdater.exe out/agent/HomeWatchUpdater.exe -Force
          dotnet publish agent/HomeWatchInstallerBroker/HomeWatchInstallerBroker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:HOMEWATCH_VERSION -o out/broker
          if ($LASTEXITCODE -ne 0) { throw "HomeWatchInstallerBroker publish failed ($LASTEXITCODE)" }
          Copy-Item out/broker/HomeWatchInstallerBroker.exe out/agent/HomeWatchInstallerBroker.exe -Force
          # Signing happens in the optional signing step below, before ZIP creation.
      - name: Install isolated Authenticode verifier
        shell: pwsh
        run: |
          # Independent PE digest + Authenticode verification, with the signing
          # certificate supplied directly to the verifier as a trust anchor.
          # No import to the GitHub runner's Trusted Root store is required.
          choco install osslsigncode --no-progress -y --version=2.6.0
          if ($LASTEXITCODE -ne 0) { throw "Unable to install osslsigncode ($LASTEXITCODE)" }
          $verifier = Get-Command osslsigncode.exe -ErrorAction Stop
          Write-Host "Using $($verifier.Source) for Authenticode digest verification"

      - name: Sign Windows binaries when a trusted publisher certificate is configured
        timeout-minutes: 8
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.HOMEWATCH_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.HOMEWATCH_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNING_PFX_BASE64) -and [string]::IsNullOrEmpty($env:SIGNING_PFX_PASSWORD)) {
            if ($env:GITHUB_REF -like 'refs/tags/v*') {
              throw 'Tagged HomeWatch releases MUST be signed: add HOMEWATCH_SIGNING_PFX_BASE64 and HOMEWATCH_SIGNING_PFX_PASSWORD.'
            }
            Write-Warning 'Unsigned main-branch CI build: GitHub release tags will require signing secrets.'
            exit 0
          }
          if ([string]::IsNullOrEmpty($env:SIGNING_PFX_BASE64) -or [string]::IsNullOrEmpty($env:SIGNING_PFX_PASSWORD)) { throw 'Both signing secrets are required' }
          $certPath = Join-Path $env:RUNNER_TEMP 'homewatch-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName.EndsWith('\x64\signtool.exe', [StringComparison]::OrdinalIgnoreCase) } | Select-Object -Last 1
            if (-not $tool) { throw 'Windows SDK signtool.exe unavailable on runner' }
            'out/agent/HomeWatchAgent.exe','out/agent/HomeWatchService.exe','out/agent/HomeWatchUpdater.exe','out/agent/HomeWatchInstallerBroker.exe' | ForEach-Object {
              & $tool.FullName sign /fd SHA256 /f $certPath /p $env:SIGNING_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_
              if ($LASTEXITCODE -ne 0) { throw "Signing failed: $_" }
            }
            # PowerShell's Get-AuthenticodeSignature can return UnknownError for
            # a valid self-signed publisher on an untrusted ephemeral runner.
            # Never accept UnknownError (or NotTrusted) as proof of integrity.
            # osslsigncode validates the embedded Authenticode signature AND
            # the PE file digest against only this exact expected signer cert.
            # -ignore-timestamp means this CI check does not validate TSA chains;
            # Windows clients still require full WinVerifyTrust + a local pin.
            Write-Host 'SignTool completed. Checking PE digests and signer fingerprints using osslsigncode.'
            $pfxCert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certPath, $env:SIGNING_PFX_PASSWORD)
            $pin = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($pfxCert.RawData))
            $pemPath = Join-Path $env:RUNNER_TEMP 'homewatch-signing-public.pem'
            $pemText = "-----BEGIN CERTIFICATE-----`n$([Convert]::ToBase64String($pfxCert.RawData, [Base64FormattingOptions]::InsertLineBreaks))`n-----END CERTIFICATE-----`n"
            [IO.File]::WriteAllText($pemPath, $pemText, [Text.Encoding]::ASCII)
            $verifier = (Get-Command osslsigncode.exe -ErrorAction Stop).Source
            'out/agent/HomeWatchAgent.exe','out/agent/HomeWatchService.exe','out/agent/HomeWatchUpdater.exe','out/agent/HomeWatchInstallerBroker.exe' | ForEach-Object {
              Write-Host "Verifying Authenticode PE digest and exact signer on $_"
              & $verifier verify -in $_ -CAfile $pemPath -ignore-timestamp -require-leaf-hash "sha256:$($pin.ToLowerInvariant())"
              if ($LASTEXITCODE -ne 0) { throw "Invalid Authenticode signature or incorrect signing certificate on $_ ($LASTEXITCODE)" }
              # Diagnostic only: CI trust-store status is NOT used to determine validity.
              $check = Get-AuthenticodeSignature -LiteralPath $_
              Write-Host "Verified $_ (Windows trust-store status: $($check.Status); exact SHA-256 signer pin and PE digest verified)"
            }
            "HOMEWATCH_SIGNER_SHA256=$pin" | Out-File -FilePath $env:GITHUB_ENV -Append
            "HOMEWATCH_SIGNER_PEM=$pemPath" | Out-File -FilePath $env:GITHUB_ENV -Append
            "SIGNTOOL_PATH=$($tool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          } finally { Remove-Item $certPath -Force -ErrorAction SilentlyContinue }

      - name: Package exact updater binaries
        shell: pwsh
        run: |
          # The privileged updater rejects unexpected archive members.
          # Keep the existing three-file update ZIP compatible with v0.6.2 clients.
          # The fourth, signed broker binary is a separate asset applied by the
          # updated service after this bridge update installs (no manual reinstall).
          $allowed = @('HomeWatchAgent.exe', 'HomeWatchService.exe', 'HomeWatchUpdater.exe')
          $paths = @($allowed | ForEach-Object { "out/agent/$_" })
          foreach ($file in $paths) {
            if (-not (Test-Path $file)) { throw "Missing expected output: $file" }
            if ((Get-Item $file).Length -gt 200MB) { throw "Updater executable exceeds 200 MiB limit: $file" }
          }
          Compress-Archive -LiteralPath $paths -DestinationPath HomeWatch-Agent-win-x64.zip -Force
          if ((Get-Item HomeWatch-Agent-win-x64.zip).Length -gt 350MB) { throw 'Updater archive exceeds 350 MiB limit' }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'HomeWatch-Agent-win-x64.zip'))
          try {
            $actual = @($zip.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            $expected = @($allowed | Sort-Object)
            if ((Compare-Object $actual $expected).Count -ne 0) { throw "Unexpected update archive contents: $($actual -join ', ')" }
          } finally { $zip.Dispose() }
          (Get-FileHash HomeWatch-Agent-win-x64.zip -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii HomeWatch-Agent-win-x64.sha256
          Copy-Item out/agent/HomeWatchInstallerBroker.exe HomeWatchInstallerBroker-win-x64.exe -Force
          if ((Get-Item HomeWatchInstallerBroker-win-x64.exe).Length -gt 200MB) { throw 'Broker exceeds 200 MiB limit' }
          (Get-FileHash HomeWatchInstallerBroker-win-x64.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii HomeWatchInstallerBroker-win-x64.sha256

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.HOMEWATCH_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.HOMEWATCH_SIGNING_PFX_PASSWORD }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:HOMEWATCH_VERSION" "agent\installer\HomeWatchAgent.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed ($LASTEXITCODE)" }
          Copy-Item out/installer/HomeWatch-Agent-Setup-win-x64.exe HomeWatch-Agent-Setup-win-x64.exe -Force
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNTOOL_PATH)) {
            $certPath = Join-Path $env:RUNNER_TEMP 'homewatch-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
              & $env:SIGNTOOL_PATH sign /fd SHA256 /f $certPath /p $env:SIGNING_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 HomeWatch-Agent-Setup-win-x64.exe
              if ($LASTEXITCODE -ne 0) { throw 'Installer signing failed' }
              Write-Host 'Verifying signed Inno Setup installer PE digest and exact pinned signer'
              if (-not (Test-Path -LiteralPath $env:HOMEWATCH_SIGNER_PEM)) { throw 'Missing CI publisher PEM file' }
              $verifier = (Get-Command osslsigncode.exe -ErrorAction Stop).Source
              & $verifier verify -in HomeWatch-Agent-Setup-win-x64.exe -CAfile $env:HOMEWATCH_SIGNER_PEM -ignore-timestamp -require-leaf-hash "sha256:$($env:HOMEWATCH_SIGNER_SHA256.ToLowerInvariant())"
              if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed ($LASTEXITCODE): invalid PE digest or wrong publisher" }
              $check = Get-AuthenticodeSignature -LiteralPath HomeWatch-Agent-Setup-win-x64.exe
              Write-Host "Verified installer signature and publisher pin (Windows trust-store status: $($check.Status))"
            } finally { Remove-Item $certPath -Force -ErrorAction SilentlyContinue }
          }
          (Get-FileHash HomeWatch-Agent-Setup-win-x64.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii HomeWatch-Agent-Setup-win-x64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: HomeWatch-Agent-win-x64
          path: |
            HomeWatch-Agent-win-x64.zip
            HomeWatch-Agent-win-x64.sha256
            HomeWatchInstallerBroker-win-x64.exe
            HomeWatchInstallerBroker-win-x64.sha256
            HomeWatch-Agent-Setup-win-x64.exe
            HomeWatch-Agent-Setup-win-x64.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            HomeWatch-Agent-win-x64.zip
            HomeWatch-Agent-win-x64.sha256
            HomeWatchInstallerBroker-win-x64.exe
            HomeWatchInstallerBroker-win-x64.sha256
            HomeWatch-Agent-Setup-win-x64.exe
            HomeWatch-Agent-Setup-win-x64.sha256

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ghcr.io/zeragonii/homewatch-server:${{ github.ref_name }}
